name: release

# Publishes to PyPI (org secret PYPI_API_TOKEN) + the MCP Registry (GitHub OIDC).
# Trigger: push a version tag, e.g. `git tag v0.1.0 && git push origin v0.1.0`.
# Pattern matches gb-eli-mcp (classic token; OIDC trusted-publishing hit a
# persistent invalid-publisher error across the fleet).

on:
  push:
    tags:
      - "v*"
  workflow_dispatch: {}   # manual re-run of the MCP Registry publish without bumping the package version

permissions:
  contents: read
  id-token: write   # required for the MCP Registry OIDC login

jobs:
  build-and-publish-pypi:
    if: github.event_name == 'push'   # only on a version tag; skipped on manual dispatch
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tooling
        run: python -m pip install --upgrade build

      - name: Build sdist + wheel
        run: python -m build

      - name: Publish to PyPI (org API token)
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}

  # Mirrors the pinned HuggingFace corpus as a gzipped release asset + sha256 sidecar.
  # NON-BLOCKING by design: PyPI publish never waits on this - if the origin download
  # fails, the package still ships and clients fall back to HuggingFace directly.
  # The asset is the fast path for first-call provisioning AND the fleet's activation
  # metric (asset download_count = a human actually used the connector).
  build-and-upload-corpus:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download pinned corpus from HuggingFace
        run: |
          curl -L --fail --retry 3 -o pk-laws-corpus.json \
            "https://huggingface.co/datasets/AyeshaJadoon/Pakistan_Laws_Dataset/resolve/81bd25d52ad21f311af47d5ab4604daea9d83aa2/pdf_data.json"

      - name: Compress + checksum
        run: |
          gzip -9 -n pk-laws-corpus.json
          sha256sum pk-laws-corpus.json.gz > pk-laws-corpus.json.gz.sha256

      - name: Upload as release asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          gh release create "$TAG" --title "$TAG" \
            --notes "pk-eli-mcp $TAG + pre-built statutes corpus (pinned HF snapshot 2025-01-30, sha256 alongside)" \
            pk-laws-corpus.json.gz pk-laws-corpus.json.gz.sha256 \
          || gh release upload "$TAG" pk-laws-corpus.json.gz pk-laws-corpus.json.gz.sha256 --clobber

  publish-mcp-registry:
    needs: build-and-publish-pypi
    # run after a successful PyPI publish, OR standalone on manual dispatch
    if: always() && (github.event_name == 'workflow_dispatch' || needs.build-and-publish-pypi.result == 'success')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write   # OIDC login to the MCP Registry
    steps:
      - uses: actions/checkout@v4

      - name: Install mcp-publisher
        run: |
          curl -L "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_amd64.tar.gz" | tar xz mcp-publisher
          sudo mv mcp-publisher /usr/local/bin/

      - name: Login to MCP Registry (GitHub OIDC)
        run: mcp-publisher login github-oidc

      - name: Publish server.json to MCP Registry
        run: mcp-publisher publish
