# Runtime of the Claude plugin: pins pk-eli-mcp and every transitive dependency
# (with hashes) in uv.lock, so the plugin runs exactly what was reviewed.
# Started by plugin.json as: uv run --frozen --project ${CLAUDE_PLUGIN_ROOT}/server pk-eli-mcp
[project]
name = "pk-eli-mcp-plugin-runtime"
version = "0.4.4"
requires-python = ">=3.11,<3.14"
dependencies = ["pk-eli-mcp==0.4.4"]

[tool.uv]
package = false
