# Runtime of the Claude plugin: pins pk-eli-mcp (git tag v0.4.4, by full commit hash) and
# every transitive dependency (with hashes) in uv.lock, so the plugin runs exactly what was
# reviewed. The git source replaces the PyPI files because their names tripped the
# directory's secret scan; the code at that commit is the code released as 0.4.4.
# Started by plugin.json as: uv run --frozen --project ${CLAUDE_PLUGIN_ROOT}/server pk-eli-mcp
[project]
name = "pakistan-law-plugin-runtime"
version = "0.4.4"
requires-python = ">=3.11,<3.14"
dependencies = ["pk-eli-mcp @ git+https://github.com/matematicsolutions/pk-eli-mcp@012f9f5bca40f6522dc384e767a4c919cf370f83"]

[tool.uv]
package = false
